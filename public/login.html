<!DOCTYPE html>
<html lang="en" class="login-page liquid-theme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0c1420">
  <title>Unlock Rovarin</title>
  <meta name="rovarin-pin-setup" content="false">
  <meta name="rovarin-pin-mode" content="manual">
  <meta name="application-name" content="Rovarin">
  <meta name="apple-mobile-web-app-title" content="Rovarin">
  <link id="loginBaseStyles" rel="stylesheet" href="/app.css" media="print">
  <style>
    /* Critical login paint is independent of the application/decorative styles. */
    :root { --font-system:system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:dark; --surface-glass-strong:linear-gradient(150deg,#1d2c3e,#101b29); --glass-border:rgba(191,218,241,.19); --tint-primary:rgba(102,199,255,.12); --accent-primary:#66c7ff; --text-primary:#eaf1f8; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#0c1420; color:#eaf1f8; font-family:system-ui,-apple-system,'Segoe UI',sans-serif; }

    .login-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface-glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: none;
      text-align: center;
    }

    .login-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--tint-primary); border: 1px solid var(--glass-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px rgba(102, 199, 255, 0.08);
    }
    .login-icon svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: var(--accent-primary);
      stroke-width: 2;
    }
    .pin-input {
      width: 100%;
      font-size: 28px;
      letter-spacing: 0.2em;
      text-align: center;
      padding: 14px 16px;
      background: rgba(10, 14, 23, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      color: var(--text-primary);
      margin: 20px 0;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .pin-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(102, 199, 255, 0.15);
    }
    .login-btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      background: var(--tint-primary); border: 1px solid var(--glass-border);
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: var(--shadow-control);
      transition: transform 0.1s, opacity 0.2s;
    }
    .login-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .error-msg {
      color: var(--state-danger);
      font-size: 14px;
      margin-top: 12px;
      /* Reserve the actual text line box, including fractional font metrics. */
      line-height: 1.45;
      min-height: 1.45em;
    }
    /* Scoped to this login document; navigation restores the normal app layout. */
    html.login-page, .login-page body {
      height: 100%; min-height: 0; overflow: hidden; overscroll-behavior: none;
    }
    .login-page body { position: fixed; inset: 0; padding: 0; }
    /* Keep wallpaper on unlocked pages only; the PIN card retains its glass. */
    html.liquid-theme.login-page body { background-color: #0c1420; background-image: none; }
    html.liquid-theme.login-page body::before,
    html.liquid-theme.login-page:not(.native-shell) body::before { content: none; }
    /* Match the shared mobile chrome selector's specificity. Login owns its
       scroll lock and has one fixed viewport surface, rather than nested fixed boxes. */
    html.login-page:not(.native-shell) body {
      position: static; min-height: 0; height: 100%; padding: 0;
      overflow: hidden; overscroll-behavior: none;
    }
    .login-page .login-container {
      position: fixed; top: var(--login-viewport-top, 0px); left: 0; width: 100%;
      height: var(--login-viewport-height, 100vh); min-height: 0;
      padding: max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      overflow: hidden; overscroll-behavior: none; touch-action: none;
      justify-content: center; container-type: size;
    }
    @supports (height: 100dvh) {
      .login-page .login-container { height: var(--login-viewport-height, 100dvh); }
    }
    .login-page .pin-input, .login-page .login-btn { touch-action: manipulation; }
    /* The compact native window IS the card; no second rectangular backdrop. */
    html.native-shell.login-page, html.native-shell.login-page body { background: transparent; }
    .native-shell.login-page .login-container { padding: 0; }
    .native-shell.login-page .login-card { flex-shrink: 0; max-width: none; min-height: 100%; padding: 28px 22px; }
    .native-shell.login-page .login-icon { width: 56px; height: 56px; margin-bottom: 16px; }
    .login-starting .pin-input { opacity: .55; }
    .login-starting .error-msg { color: var(--text-secondary); }
    .login-starting .login-btn:disabled { opacity: .8; }
    /* Only the native host creates these controls. Mobile layout is unchanged. */
    .lock-window-drag, .lock-window-controls { display: none; }
    .native-shell.login-page .login-card { position: relative; }
    .native-shell.login-page .lock-window-drag {
      display: block; position: absolute; inset: 0 0 auto; height: 112px;
      app-region: drag; -webkit-app-region: drag; user-select: none;
    }
    .native-shell.login-page .lock-window-controls {
      display: flex; position: absolute; top: 12px; right: 12px; gap: 4px;
      app-region: no-drag; -webkit-app-region: no-drag;
    }
    .native-shell.login-page .lock-window-controls button {
      width: 32px; height: 32px; display: grid; place-items: center;
      border: 1px solid transparent; border-radius: 10px; background: transparent;
      color: var(--text-secondary); font: 22px/1 var(--font-system); cursor: pointer;
      app-region: no-drag; -webkit-app-region: no-drag;
      transition: background .15s ease, color .15s ease;
    }
    .native-shell.login-page .lock-window-controls button:hover {
      color: var(--text-primary); background: var(--bg-subtle); border-color: var(--glass-border);
    }
    .native-shell.login-page #lock-window-exit:hover { background: var(--tint-danger); color: var(--state-danger); }
    .native-shell.login-page .lock-window-controls button:active { background: var(--tint-primary); }
    .native-shell.login-page .lock-window-controls button:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 1px; }
    .native-shell.login-page .pin-input, .native-shell.login-page .login-btn,
    .native-shell.login-page .error-msg { app-region: no-drag; -webkit-app-region: no-drag; }
    /* Compact only the decorative spacing when the keyboard reduces usable height. */
    .login-page.login-keyboard .login-container { padding-bottom: 12px; }
    @container (max-height: 480px) {
      .login-page:not(.native-shell) .login-card { padding: 18px 20px; }
      .login-page:not(.native-shell) .login-icon { width: 44px; height: 44px; margin-bottom: 10px; }
      .login-page:not(.native-shell) .pin-input { margin: 12px 0; }
    }
    @container (max-height: 350px) {
      .login-page:not(.native-shell) .login-card { padding: 12px 18px; }
      .login-page:not(.native-shell) .login-icon,
      .login-page:not(.native-shell) .login-card > p { display: none; }
      .login-page:not(.native-shell) .pin-input { padding: 10px 14px; margin: 8px 0; font-size: 24px; }
      .login-page:not(.native-shell) .login-btn { padding: 12px; min-height: 44px; }
      .login-page:not(.native-shell) .error-msg { margin-top: 8px; }
    }
  </style>
  <link id="liquidStyles" rel="stylesheet" href="/liquid-glass.css" media="print">
<link rel="icon" href="/rovarin-icon.png"><link rel="apple-touch-icon" href="/rovarin-touch.png"><style>.rovarin-login-brand{background:transparent;border:0;box-shadow:none}.rovarin-login-brand svg{width:64px;height:64px;stroke:none}</style></head>
<body class="dark-theme">
  <div class="login-container">
    <div class="login-card">
      <div class="login-icon rovarin-login-brand"><svg viewBox="0 0 128 128" aria-hidden="true" class="rovarin-brand-mark"><circle cx="64" cy="64" r="60" fill="#82ceff"/><rect x="23" y="36" width="82" height="56" rx="11" fill="#090f19"/><rect x="30" y="43" width="8" height="42" rx="4" fill="#82ceff"/><path d="M47 64h10l8-14 11 28 8-14h12" fill="none" stroke="#82ceff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 6px;">Rovarin</h2>
      <p style="color: #94a3b8; font-size: 14px; margin-bottom: 8px;">Your PC in your pocket.</p>
      <input type="password" id="pinInput" class="pin-input" pattern="[0-9]{6}|[0-9]{8}|[0-9]{12}" inputmode="numeric" placeholder="••••••" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="Rovarin PIN (6, 8 or 12 digits)">
      <button id="unlockBtn" class="login-btn">Unlock Dashboard</button>
      <div id="errMsg" class="error-msg" role="status" aria-live="polite"></div>
    </div>
  </div>
  <link id="pinFlowStyles" rel="stylesheet" href="/pin-lifecycle.css" media="print">
  <script src="/login.js" defer></script>
  <script src="/pin-lifecycle.js" defer></script>
  <script async src="/liquid-bootstrap.js"></script>
</body>
</html>
